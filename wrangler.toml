name = "acme-colibri"
main = "src/index.ts"
compatibility_date = "2026-08-01"
keep_vars = true
workers_dev = false

[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/present", "/cleanup", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "acme-colibri"
migrations_dir = "migrations"
